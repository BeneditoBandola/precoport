name: Atualizar Dados PDV Pet

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar main.py
        run: python main.py

      - name: Enviar CSV atualizado para o Repositório
        run: |
          git config --global user.name "Robo Automation"
          git config --global user.email "robo@actions.com"
          git add historico_p9_p10.csv
          git commit -m "Atualizacao automatica de dados do PDV" || echo "Sem mudanças para commitar"
          git push
